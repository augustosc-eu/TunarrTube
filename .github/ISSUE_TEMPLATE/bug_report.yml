name: Bug report
description: Report unexpected behavior in TunarrTube.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report. Before you do:
        - **Security vulnerability?** Please don't use this form — see [SECURITY.md](../../SECURITY.md) for private reporting instructions.
        - Search [existing issues](../../issues) to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: What did you do, in order, that led to the bug?
      placeholder: |
        1. Add source '...'
        2. Trigger sync / start a download
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Docker Compose
        - Docker (plain)
        - npm run dev / npm start
        - Other (describe below)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: TunarrTube version or commit
      description: Image tag, release version, or commit SHA.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: OS / platform
      placeholder: e.g. Debian 12 (Docker host), macOS 15, Windows 11
    validations:
      required: true

  - type: input
    id: tool-versions
    attributes:
      label: yt-dlp / FFmpeg / Node versions
      description: Run `yt-dlp --version`, `ffmpeg -version`, `node -v` if applicable.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >
        Paste relevant output from the app or container logs. **Redact URLs, signed googlevideo/YouTube
        links, cookies, and any other credentials before pasting** — see SECURITY.md. Use a code block.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help — screenshots, source config, Tunarr version, etc.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I confirm this report does not contain credentials, signed video URLs, or other private data.
          required: true
        - label: I have searched existing issues and this isn't a duplicate.
          required: true
