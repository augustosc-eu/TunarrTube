services:
  ytarr:
    build: .
    container_name: ytarr
    ports:
      - "127.0.0.1:${YTARR_PORT:-3000}:3000"
    environment:
      DATABASE_URL: file:/config/ytarr.db
      YTARR_MEDIA_DIR: /media
      YTARR_THUMBNAIL_DIR: /config/thumbnails
      YTARR_TUNARR_URL: ${YTARR_TUNARR_URL:-http://tunarr:8000}
      TZ: ${TZ:-UTC}
    volumes:
      - ytarr-config:/config
      - ytarr-media:/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped

  tunarr:
    image: ${TUNARR_IMAGE:-chrisbenincasa/tunarr:latest}
    container_name: tunarr
    profiles: ["tunarr"]
    ports:
      - "127.0.0.1:${TUNARR_PORT:-8000}:8000"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - tunarr-config:/config/tunarr
      - ytarr-media:/media:ro
    restart: unless-stopped

volumes:
  ytarr-config:
  ytarr-media:
  tunarr-config:
